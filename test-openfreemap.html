<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link href="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; padding: 0; background: #070B14; }
    #map-liberty { width: 500px; height: 400px; margin: 20px; border-radius: 20px; overflow: hidden; }
    #map-dark { width: 500px; height: 400px; margin: 20px; border-radius: 20px; overflow: hidden; }
    .row { display: flex; }
  </style>
</head>
<body>
  <div class="row">
    <div>
      <h3 style="color:white;font-family:sans-serif;margin-left:20px;">OpenFreeMap Liberty</h3>
      <div id="map-liberty"></div>
    </div>
    <div>
      <h3 style="color:white;font-family:sans-serif;margin-left:20px;">OpenFreeMap Dark</h3>
      <div id="map-dark"></div>
    </div>
  </div>

  <script>
    const center = [-63.18212, -17.78329]; // Plaza 24 de Septiembre

    const map1 = new maplibregl.Map({
      container: 'map-liberty',
      style: 'https://tiles.openfreemap.org/styles/liberty',
      center: center,
      zoom: 15.5
    });

    const map2 = new maplibregl.Map({
      container: 'map-dark',
      style: 'https://tiles.openfreemap.org/styles/dark',
      center: center,
      zoom: 15.5
    });
  </script>
</body>
</html>
