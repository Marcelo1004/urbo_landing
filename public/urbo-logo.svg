<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="urboBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5BE" />
      <stop offset="100%" stop-color="#00C9A7" />
    </linearGradient>
    <filter id="urboGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00E5BE" flood-opacity="0.6" />
    </filter>
  </defs>
  <!-- Background Badge Container -->
  <rect width="120" height="120" rx="28" fill="#070B14" />
  <rect x="2" y="2" width="116" height="116" rx="26" fill="none" stroke="rgba(0, 229, 190, 0.3)" stroke-width="2" />
  
  <!-- Outer U telemetry loop -->
  <path d="M 28 32 V 76 C 28 92, 92 92, 92 76 V 32" fill="none" stroke="url(#urboBrandGrad)" stroke-width="7" stroke-linecap="round" filter="url(#urboGlow)" />
  
  <!-- Central Digital Bus Symbol -->
  <rect x="44" y="42" width="32" height="36" rx="8" fill="#0B1426" stroke="#00E5BE" stroke-width="3" />
  <!-- Windshield -->
  <rect x="49" y="47" width="22" height="12" rx="3" fill="#00E5BE" opacity="0.9" />
  <!-- Headlights -->
  <circle cx="51" cy="68" r="2.5" fill="#FFFFFF" />
  <circle cx="69" cy="68" r="2.5" fill="#FFFFFF" />
  <!-- Wheels / Track -->
  <rect x="42" y="52" width="3" height="8" rx="1.5" fill="#00C9A7" />
  <rect x="75" y="52" width="3" height="8" rx="1.5" fill="#00C9A7" />
  <rect x="42" y="66" width="3" height="8" rx="1.5" fill="#00C9A7" />
  <rect x="75" y="66" width="3" height="8" rx="1.5" fill="#00C9A7" />
  <!-- GPS Antenna Pulse -->
  <circle cx="60" cy="34" r="3" fill="#A6FF00" />
</svg>

